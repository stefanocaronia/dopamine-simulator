<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulazione Dopamina — Cervello ADHD</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a1a;color:#c8d6e5;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{text-align:center;width:100%;max-width:1400px;font-size:1.5rem;font-weight:600;color:#e0e8f0;padding:18px 14px 2px;text-shadow:0 0 20px rgba(0,229,255,0.3)}

.toast-item.t-signal-on{background:rgba(0,255,136,0.12);border:1px solid #00ff8844;color:#00ff88;text-shadow:0 0 12px rgba(0,255,136,0.5)}
.toast-item.t-signal-off{background:rgba(255,204,0,0.12);border:1px solid #ffcc0044;color:#ffcc00;text-shadow:0 0 12px rgba(255,204,0,0.4)}
.toast-item.t-caff{background:rgba(210,105,30,0.15);border:1px solid #D2691E44;color:#D2691E;text-shadow:0 0 12px rgba(210,105,30,0.4)}
.toast-item.t-exer{background:rgba(34,139,34,0.15);border:1px solid #22882244;color:#44cc44;text-shadow:0 0 12px rgba(34,139,34,0.4)}
.toast-item.t-sleep{background:rgba(100,60,140,0.15);border:1px solid #6644aa44;color:#9977cc;text-shadow:0 0 12px rgba(100,60,140,0.4)}
.toast-item.t-depl{background:rgba(255,51,85,0.12);border:1px solid #ff335544;color:#ff3355;text-shadow:0 0 12px rgba(255,51,85,0.5)}
#sidebar{flex:0 0 220px;display:flex;flex-direction:column;gap:16px;padding:10px 0;justify-content:space-between}
#controls{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.ctrl-group{display:flex;flex-direction:column;align-items:stretch;gap:7px}

.ctrl-group .val{font-size:1rem;font-weight:700;color:#aabbcc;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:#1a2a3a;border-radius:6px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#00e5ff;border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,0.5)}

#stimulus::-moz-range-thumb{background:#00ff88}
.toggle-wrap{display:flex;align-items:center;gap:10px}.toggle-wrap span{font-size:.95rem;font-weight:700}

.switch{position:relative;width:48px;height:26px}.switch input{opacity:0;width:0;height:0}

.switch input:checked+.sl{background:#00e5ff22;border-color:#00e5ff55}
.switch input:checked+.sl::before{transform:translateX(22px);background:#00e5ff}
.btn{padding:5px 18px;border:1px solid #2a3a4a;background:#111a24;color:#8899aa;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#00e5ff55;color:#00e5ff}
.btn-row{display:flex;gap:10px}
#legend{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-top:1px solid #1a2a3a}
#legend .leg-title{font-size:.82rem;color:#556;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:2px}
.leg-item{display:flex;align-items:center;gap:7px;font-size:.85rem;color:#778899}
.leg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}

.pu-fill.pu-ex{background:rgba(34,139,34,0.25)}
.pu-fill.pu-sleep{background:rgba(100,60,140,0.3)}
.pu-label{position:relative;z-index:1}
.serbatoio-btn{padding:5px 18px;border:1px solid #2a3a4a;background:#111a24;border-radius:8px;position:relative;overflow:hidden;text-align:center;color:#8899aa;font-weight:600;cursor:default}
.pu-fill.pu-serb{background:rgba(0,204,102,0.2)}
@media(max-width:768px){h1{font-size:1.2rem}#app{flex-direction:column}#sidebar{flex:none;width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px}#canvas-wrap{min-width:auto;width:100%}}
</style>

<body>
<h1>Come funziona la Dopamina<small>ADHD vs Neurotipico — simulazione interattiva</small></h1>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="toasts"></div>
    <div id="btn-pause" class="hud" style="top:30px;left:50%;transform:translateX(-50%);cursor:pointer;pointer-events:auto;font-size:1.8rem;color:rgba(200,220,240,0.15);user-select:none;transition:color .2s" onmouseenter="this.style.color='rgba(200,220,240,0.4)'" onmouseleave="this.style.color='rgba(200,220,240,0.15)'">⏸</div>
  </div>
  <div id="sidebar">
    <div id="controls">
      <div class="ctrl-group"><div class="toggle-wrap"><span class="t-adhd">ADHD</span><label class="switch"><input type="checkbox" id="mode-tog"><span class="sl"></span></label><span class="t-norm">Neurotipico</span></div></div>
      <div class="ctrl-group"><label>Stimolo <span style="font-weight:400;font-size:.7rem;color:#556">(Novità, Sfida, Paura)</span></label><input type="range" id="stimulus" min="0" max="100" value="10"><span class="val" id="stim-val">10%</span></div>
      <div class="ctrl-group"><label>Tempo <span style="font-weight:400;font-size:.7rem;color:#556">(Scala)</span></label><input type="range" id="speed" min="1" max="8" value="2" step="0.5"><span class="val" id="speed-val">2&times;</span></div>
      <div class="btn-row">
      </div>
      <div id="powerups">
        <button class="btn pu-btn" id="btn-caffeine"><span class="pu-fill" id="caff-fill"></span><span class="pu-label">☕ Caffeina</span></button>
        <button class="btn pu-btn" id="btn-exercise"><span class="pu-fill pu-ex" id="exer-fill"></span><span class="pu-label">🏃 Esercizio</span></button>
        <button class="btn pu-btn" id="btn-reset"><span class="pu-fill pu-sleep" id="sleep-fill"></span><span class="pu-label">💤 Sonno</span></button>
        <div class="pu-btn serbatoio-btn">
          <span class="pu-fill pu-serb" id="serbatoio-fill"></span>
          <span class="pu-label" style="font-size:.8rem">🧪 Serbatoio dopamina <b id="serbatoio-pct">100%</b></span>
        </div>
      </div>
    </div>
    <div id="legend">
      <div class="leg-title">Legenda</div>
      <div class="leg-item"><div class="leg-dot" style="background:#00ff88"></div>Dopamina</div>
      <div class="leg-item"><div class="leg-dot" style="background:#ff3355"></div>Dopamina distrutta</div>
      <div class="leg-item"><div class="leg-dot" style="background:#aa55ff"></div>DAT1 (membrana)</div>
      <div class="leg-item"><div class="leg-dot" style="background:#ff8833"></div>COMT (enzima)</div>
      <div class="leg-item"><div class="leg-dot" style="background:#3388dd"></div>VMAT2 (riciclo)</div>
      <div class="leg-item"><div class="leg-dot" style="background:#ff3355"></div>MAO-B (distruzione)</div>
      <div class="leg-item"><div class="leg-dot" style="background:#ffcc00;border-radius:3px;width:14px;height:8px"></div>Recettore D2</div>
    </div>
  </div>
</div>
<script>
const MODES={
  adhd:  {d2Count:5, dat1Speed:2.0,dat1Count:5,comtRate:0.04,vmat2Ratio:0.55,snap25Eff:1.0,label:'ADHD'},
  normal:{d2Count:12,dat1Speed:0.7,dat1Count:3,comtRate:0.015,vmat2Ratio:0.75,snap25Eff:1.0,label:'Neurotipico'}
};
const MAX_VES=100,MAX_P=500,BIND_DIST=22;
const ACT_THRESHOLD=0.8,SIGNAL_PER_BIND=0.5,SIGNAL_HALF_LIFE=0.6;

let mode='adhd',stimulus=0.1,speedMul=2,paused=false;
let vesCount=MAX_VES,vesicles=[],particles=[],receptors=[],postNeurons=[],dat1s=[],comts=[];
let stats={recycled:0,maob:0,comt:0,total:0,binds:0};
let W,H,dpr,PRE={},CLEFT={},POST={},SNAP={},VMAT_Z={},MAO_Z={};
// Precomputed dendrite paths (no flicker)
let preDendrites=[], postDendrites=[];

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');

function resize(){
  const r=document.getElementById('canvas-wrap').getBoundingClientRect();
  dpr=window.devicePixelRatio||1;W=r.width;H=r.height;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // Layout: PRE neuron | CLEFT | dendrites+gap | POST neurons (cropped tighter on right)
  PRE={x:0,y:0,w:W*.30,h:H};
  CLEFT={x:PRE.w,y:0,w:W*.40,h:H};
  // POST neurons close to receptor line, small gap for dendrites
  const dendGap=W*.05;
  POST={x:PRE.w+CLEFT.w+dendGap,y:0,w:W-PRE.w-CLEFT.w-dendGap-2,h:H};
  SNAP={x:PRE.w-2,y:H*.05,w:10,h:H*.90};
  // VMAT2 and MAO-B zones must be INSIDE the neuron body
  // Neuron center is at PRE.w*0.48, rBase ~= min(PRE.w*0.40, H*0.42)
  const nCx=PRE.w*.48, nCy=H*.5, rEst=Math.min(PRE.w*.38,H*.38);
  const zoneW=rEst*.9, zoneH=rEst*.45;
  VMAT_Z={x:nCx-zoneW/2, y:nCy-rEst*.65, w:zoneW, h:zoneH};
  MAO_Z={x:nCx-zoneW/2, y:nCy+rEst*.25, w:zoneW, h:zoneH};
  rebuildAll();
  buildDendrites();
}

function rebuildAll(){
  vesicles=[];
  // Vesicles in the middle band between VMAT2 and MAO-B
  const va={x:VMAT_Z.x,y:VMAT_Z.y+VMAT_Z.h+5,w:VMAT_Z.w,h:MAO_Z.y-VMAT_Z.y-VMAT_Z.h-10};
  for(let i=0;i<50;i++)vesicles.push({x:va.x+Math.random()*va.w,y:va.y+Math.random()*va.h,ph:Math.random()*6.28});
  postNeurons=[];const nC=3,gap=14,nH=(H-gap*(nC+1))/nC;
  for(let i=0;i<nC;i++)postNeurons.push({x:POST.x,y:gap+i*(nH+gap),w:POST.w,h:nH,signal:0,glow:0,active:false});
  rebuildReceptors();rebuildDat1();
  comts=[];for(let i=0;i<5;i++)comts.push({x:CLEFT.x+8+Math.random()*(CLEFT.w-16),y:20+Math.random()*(H-40),vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8});
}

function rebuildReceptors(){
  const cfg=MODES[mode];receptors=[];
  // Receptors sit at the cleft right edge (where dendrites meet cleft)
  const recX=CLEFT.x+CLEFT.w+4;
  postNeurons.forEach((n,ni)=>{const c=cfg.d2Count,sp=n.h/(c+1);
    for(let j=0;j<c;j++)receptors.push({x:recX,y:n.y+sp*(j+1),ni,occupied:false,particle:null,timer:0,cooldown:0});
  });
}

function rebuildDat1(){
  const cfg=MODES[mode];dat1s=[];const sp=H/(cfg.dat1Count+1);
  for(let i=0;i<cfg.dat1Count;i++)dat1s.push({x:PRE.w+2,y:sp*(i+1),state:'idle',target:null,arm:0,timer:0});
}

function buildDendrites(){
  // Precompute stable dendrite paths for presynaptic neuron (no random per frame = no flicker)
  preDendrites=[];
  const cx=PRE.w*.48,cy=H*.5,rBase=Math.min(PRE.w*.40,H*.42);
  // Only left-side dendrites (away from cleft)
  const dendDefs=[
    {sx:cx-rBase*.9,sy:cy-rBase*.5,dx:-1,dy:-.8,depth:3,len:rBase*.4},
    {sx:cx-rBase*.85,sy:cy+rBase*.55,dx:-1,dy:.7,depth:3,len:rBase*.35},
  ];
  for(const d of dendDefs){
    const segs=[];
    buildDendPath(segs,d.sx,d.sy,d.dx,d.dy,d.depth,d.len);
    preDendrites.push(segs);
  }

  // Precompute dendrite paths: from neuron left edge TO receptor line
  postDendrites=[];
  const recX=CLEFT.x+CLEFT.w+4; // where receptors sit
  for(let i=0;i<postNeurons.length;i++){
    const n=postNeurons[i];
    const ncx=n.x+n.w*.5,ncy=n.y+n.h*.5,nRadius=Math.min(n.w*.44,n.h*.40),nrx=nRadius,nry=nRadius;
    const segs=[];
    const dCount=4;
    for(let j=0;j<dCount;j++){
      // Start: left edge of neuron body
      const frac=(j+0.5)/dCount;
      const angle=Math.PI*0.6+Math.PI*0.8*frac; // left hemisphere of the ellipse
      const startX=ncx+Math.cos(angle)*nrx;
      const startY=ncy+Math.sin(angle)*nry;
      // End: receptor line at matching Y
      const endX=recX;
      const endY=startY+(Math.random()-.5)*10;
      // Control point for a gentle curve
      const midX=(startX+endX)/2;
      const midY=(startY+endY)/2+(Math.random()-.5)*15;
      segs.push({sx:startX,sy:startY,cpx:midX,cpy:midY,ex:endX,ey:endY});
    }
    postDendrites.push(segs);
  }
}

function buildDendPath(segs,sx,sy,dx,dy,depth,len){
  if(depth<=0||len<8)return;
  const ex=sx+dx*len+Math.sin(sy*.1)*len*.15;
  const ey=sy+dy*len+Math.cos(sx*.1)*len*.15;
  const cpx=sx+dx*len*.5+(Math.sin(sx+sy))*10;
  const cpy=sy+dy*len*.5+(Math.cos(sx-sy))*10;
  segs.push({sx,sy,cpx,cpy,ex,ey,w:Math.max(1,depth*.8),spine:depth<=2});
  buildDendPath(segs,ex,ey,dx-.3+Math.sin(ey)*.3,dy-.3+Math.cos(ex)*.3,depth-1,len*.6);
  if(Math.sin(sx*sy)>-0.2) buildDendPath(segs,ex,ey,dx+.5-Math.sin(sy)*.5,dy+.5-Math.cos(sx)*.5,depth-1,len*.5);
}

function spawn(x,y){
  if(particles.length>=MAX_P)return null;
  const cleftPx=CLEFT.w;
  const p={x,y,vx:cleftPx*2.5+Math.random()*cleftPx*1.5,vy:(Math.random()-.5)*cleftPx*1.5,state:'free',alpha:1,target:null,timer:0,immune:0,age:0};
  particles.push(p);return p;
}

let lastT=0,relAccum=0;
function update(dt){
  const cfg=MODES[mode],sdt=dt*speedMul;

  // Caffeina timer
  if(caffeineTimer>0){
    caffeineTimer-=dt;
    document.getElementById('caff-fill').style.width=Math.max(0,caffeineTimer/CAFF_DUR*100)+'%';
    if(caffeineTimer<=0){caffeineActive=false;document.getElementById('caff-fill').style.width='0';}
  }
  // Esercizio timer — also boosts vesicle synthesis
  if(exerciseTimer>0){
    exerciseTimer-=dt;
    document.getElementById('exer-fill').style.width=Math.max(0,exerciseTimer/EXER_DUR*100)+'%';
    vesCount=Math.min(MAX_VES,vesCount+(0.5-sleepDebt*0.3)*sdt); // exercise boosts synthesis, less if sleep deprived
    if(exerciseTimer<=0){exerciseActive=false;document.getElementById('exer-fill').style.width='0';}
  }
  // Sleep debt: grows with stimulus intensity over time
  // High stimulus = brain working hard = sleep debt accumulates
  // Sleep debt grows faster, and grows even without stimulus (just slower)
  // At max stimulus: fills in ~30 seconds. At zero stimulus: ~3 minutes.
  sleepDebt=Math.min(1,sleepDebt+(0.0015+stimulus*0.007)*sdt);
  document.getElementById('sleep-fill').style.width=(sleepDebt*100)+'%';

  // Exercise adds a gentle dopamine boost (lower cost than stimulus-driven release)
  // Exercise boost reduced by sleep debt (max 15, min 5 at full debt)
  const exerciseBoost=exerciseActive?15-sleepDebt*10:0;
  const rate=(stimulus*30+exerciseBoost)*cfg.snap25Eff;
  relAccum+=rate*sdt;
  while(relAccum>=1){
    relAccum-=1;
    if(vesCount>1){
      // Exercise costs less vesicle drain (different mechanism)
      const cost=exerciseActive?0.02:0.05;
      vesCount=Math.max(0,vesCount-cost);
      // Vesicle fuses at random point along presynaptic membrane (purple line)
      spawn(CLEFT.x+2, 15+Math.random()*(H-30));stats.total++;rateRelCount++;
    }
  }
  if(vesCount<MAX_VES){vesCount+=0.2*sdt;if(vesCount>MAX_VES)vesCount=MAX_VES;}

  const cleftLeft=CLEFT.x+3,cleftRight=CLEFT.x+CLEFT.w;
  const receptorLine=cleftRight+10;
  const brownian=CLEFT.w*3,seekForce=CLEFT.w*8;

  for(const p of particles){
    if(p.state==='free'){
      if(p.immune>0)p.immune-=sdt;
      p.vx+=(Math.random()-.5)*brownian*sdt;
      p.vy+=(Math.random()-.5)*brownian*sdt;
      if(p.x<cleftRight)p.vx+=CLEFT.w*1.0*sdt;
      if(p.immune<=0&&p.x>CLEFT.x+CLEFT.w*0.3){
        let bestR=null,bestD=Infinity;
        for(const r of receptors){if(r.occupied||r.cooldown>0)continue;const d=Math.hypot(r.x-p.x,r.y-p.y);if(d<bestD){bestD=d;bestR=r;}}
        if(bestR&&bestD<CLEFT.w*1.5&&bestD>BIND_DIST*1.5){
          const dx=bestR.x-p.x,dy=bestR.y-p.y,dist=Math.max(1,Math.hypot(dx,dy));
          const force=seekForce*sdt*0.5*(1/(1+dist*.02));
          p.vx+=dx/dist*force;p.vy+=dy/dist*force;
        }
      }
      const damp=Math.pow(0.12,sdt);p.vx*=damp;p.vy*=damp;
      p.x+=p.vx*sdt;p.y+=p.vy*sdt;
      // DAT1 reuptake zone: wider and more aggressive in ADHD
      // But freshly released particles (age < 0.15s) are immune — still exiting SNAP25
      const dat1Zone=cleftLeft+3+cfg.dat1Speed*4;
      if(p.x<dat1Zone && p.age>0.15){
        // Without caffeine: DAT1 catches almost everything (95% ADHD, 85% Normal)
        // With caffeine: DAT1 is blocked, most particles bounce back into cleft
        const baseProb=0.7+cfg.dat1Speed*0.12; // ADHD:~0.94, Normal:~0.78
        let reuptakeProb=baseProb;
        if(caffeineActive){
          const blockPower=0.85-sleepDebt*0.4; // caffeine blocks 85% of reuptake (less if sleep deprived)
          reuptakeProb=baseProb*(1-blockPower); // ADHD: 0.94*0.15=0.14, Normal: 0.78*0.15=0.12
        }
        if(Math.random()<reuptakeProb){
          p.state='reuptake';p.target={x:PRE.w*0.5,y:p.y};rateReabCount++;
        } else {
          // Bounce back gently into mid-cleft (caffeine effect)
          p.x=dat1Zone+5;
          p.vx=CLEFT.w*0.5+Math.random()*CLEFT.w*0.3;
          p.vy+=(Math.random()-.5)*CLEFT.w*0.5;
          p.immune=0.3; // immune from DAT1 for 300ms after bounce
        }
        continue;
      }
      if(p.x>receptorLine){p.x=receptorLine-2;p.vx=-Math.abs(p.vx)*0.3;}
      if(p.y<8){p.y=10;p.vy=Math.abs(p.vy)*0.1;}
      if(p.y>H-8){p.y=H-10;p.vy=-Math.abs(p.vy)*0.1;}
      p.age+=sdt;if(p.age>2.0){p.state='comt_destroy';p.timer=0;}
    }
    if(p.state==='reuptake'&&p.target){
      const lr=1-Math.pow(.001,sdt);p.x+=(p.target.x-p.x)*lr;p.y+=(p.target.y-p.y)*lr;
      if(Math.hypot(p.x-p.target.x,p.y-p.target.y)<4){
        if(Math.random()<cfg.vmat2Ratio){p.state='recycle';p.target={x:VMAT_Z.x+Math.random()*VMAT_Z.w,y:VMAT_Z.y+Math.random()*VMAT_Z.h};p.timer=0;}
        else{p.state='degrade';p.target={x:MAO_Z.x+Math.random()*MAO_Z.w,y:MAO_Z.y+Math.random()*MAO_Z.h};p.timer=0;}
      }
    }
    if(p.state==='recycle'&&p.target){
      const lr=1-Math.pow(.002,sdt);p.x+=(p.target.x-p.x)*lr;p.y+=(p.target.y-p.y)*lr;
      if(Math.hypot(p.x-p.target.x,p.y-p.target.y)<5){p.state='dead';vesCount=Math.min(MAX_VES,vesCount+0.04);stats.recycled++;}
    }
    if(p.state==='degrade'&&p.target){
      const lr=1-Math.pow(.002,sdt);p.x+=(p.target.x-p.x)*lr;p.y+=(p.target.y-p.y)*lr;
      p.timer+=sdt;p.alpha=Math.max(0,1-p.timer*1.8);if(p.alpha<=0){p.state='dead';stats.maob++;}
    }
    if(p.state==='comt_destroy'){p.timer+=sdt;p.alpha=Math.max(0,1-p.timer*2.5);if(p.alpha<=0){p.state='dead';stats.comt++;}}
    if(p.state==='bound'){p.timer+=sdt;
      if(p.timer>0.08+Math.random()*.08){
        const r=receptors.find(r=>r.particle===p);
        if(r){r.occupied=false;r.particle=null;r.cooldown=0.12;}
        p.state='free';p.timer=0;p.vx=-CLEFT.w*4;p.vy=(Math.random()-.5)*CLEFT.w;p.immune=0.4;
      }
    }
  }
  particles=particles.filter(p=>p.state!=='dead');

  for(const r of receptors){if(r.cooldown>0){r.cooldown-=sdt;continue;}if(r.occupied)continue;
    for(const p of particles){if(p.state!=='free'||p.immune>0)continue;
      if(Math.hypot(p.x-r.x,p.y-r.y)<BIND_DIST){r.occupied=true;r.particle=p;p.state='bound';p.x=r.x;p.y=r.y;p.timer=0;postNeurons[r.ni].signal+=SIGNAL_PER_BIND;stats.binds++;break;}
    }
  }

  let prevActive=postNeurons.filter(n=>n.active).length;
  for(const n of postNeurons){
    // Signal decays faster with sleep debt (half-life shrinks)
    const hl=SIGNAL_HALF_LIFE/(1+sleepDebt*1.2);
    n.signal*=Math.pow(0.5,sdt/hl);
    // Sleep debt raises threshold: 0 debt = normal, 1.0 debt = +150% threshold
    // Also decays signal faster (tired brain loses signal quicker)
    const thresh=ACT_THRESHOLD*(1+sleepDebt*1.5);
    n.active=n.signal>=thresh;
    n.glow=n.active?Math.min(1,n.glow+6*sdt):Math.max(0,n.glow-4*sdt);
  }
  let nowActive=postNeurons.filter(n=>n.active).length;
  // Rate tracking: compute per-second averages
  rateWindow+=dt;
  if(rateWindow>=0.5){displayRelRate=Math.round(rateRelCount/rateWindow);displayReabRate=Math.round(rateReabCount/rateWindow);rateRelCount=0;rateReabCount=0;rateWindow=0;}
  updateToasts();

  // DAT1 transporters — grab particles and pull them back
  // Caffeine slows them down and makes them fail to grab
  for(const d of dat1s){
    if(d.state==='idle'){let best=null,bestD=Infinity;
      for(const p of particles){if(p.state!=='free'||p.immune>0)continue;const dist=Math.hypot(p.x-d.x,p.y-d.y);if(dist<bestD&&p.x>d.x-10&&dist<CLEFT.w*2){bestD=dist;best=p;}}
      if(best){d.target=best;d.state='reaching';d.timer=0;}
    }
    if(d.state==='reaching'){
      // Caffeine: DAT1 moves at half speed
      const spd=caffeineActive?cfg.dat1Speed*0.3:cfg.dat1Speed;
      d.timer+=sdt*spd;d.arm=Math.min(1,d.timer*2);
      if(d.target&&d.target.state!=='free'){d.state='idle';d.arm=0;d.target=null;continue;}
      if(d.arm>=1&&d.target){
        // Caffeine: 85% chance to fail the grab (arm reaches but can't hold)
        const caffFail=caffeineActive&&Math.random()<0.85;
        if(caffFail){
          d.state='idle';d.arm=0;d.target=null;
        } else {
          d.target.state='reuptake';d.target.target={x:PRE.w*.5,y:d.y};d.state='pulling';d.timer=0;rateReabCount++;
        }
      }
    }
    if(d.state==='pulling'){d.timer+=sdt*cfg.dat1Speed;d.arm=Math.max(0,1-d.timer*2.5);if(d.arm<=0){d.state='idle';d.target=null;d.timer=0;}}
  }

  for(let ci=0;ci<comts.length;ci++){
    const c=comts[ci];
    // Repulsion from other COMTs (prevent clumping)
    for(let cj=0;cj<comts.length;cj++){
      if(ci===cj)continue;const o=comts[cj];
      const dx=c.x-o.x,dy=c.y-o.y,d=Math.max(1,Math.hypot(dx,dy));
      if(d<60){c.vx+=dx/d*0.4*(60-d)/60;c.vy+=dy/d*0.4*(60-d)/60;}
    }
    // Hunt nearest particle but with some randomness to spread out
    let nearest=null,nearDist=Infinity;
    for(const p of particles){if(p.state!=='free')continue;const d=Math.hypot(p.x-c.x,p.y-c.y);if(d<nearDist){nearDist=d;nearest=p;}}
    if(nearest&&nearDist<120){const dx=nearest.x-c.x,dy=nearest.y-c.y,dist=Math.max(1,Math.hypot(dx,dy));c.vx+=dx/dist*.15;c.vy+=dy/dist*.15;}
    // Stronger random wander
    c.vx+=(Math.random()-.5)*.4;c.vy+=(Math.random()-.5)*.4;
    c.vx*=.90;c.vy*=.90;
    c.x+=c.vx*sdt*40;c.y+=c.vy*sdt*40;
    if(c.x<CLEFT.x+8){c.x=CLEFT.x+8;c.vx=Math.abs(c.vx);}
    if(c.x>CLEFT.x+CLEFT.w-8){c.x=CLEFT.x+CLEFT.w-8;c.vx=-Math.abs(c.vx);}
    if(c.y<12){c.y=12;c.vy=Math.abs(c.vy);}
    if(c.y>H-12){c.y=H-12;c.vy=-Math.abs(c.vy);}
    if(Math.random()<cfg.comtRate*speedMul){for(const p of particles){if(p.state!=='free')continue;if(Math.hypot(p.x-c.x,p.y-c.y)<16){p.state='comt_destroy';p.timer=0;break;}}}
  }
}

// Stacking toast system
let signalToast=''; // 'on' | 'off' | ''
let signalToastTimer=0;

function updateToasts(){
  const container=document.getElementById('toasts');
  if(sleepToastTimer>0)sleepToastTimer-=1/60;
  let html='';
  if(sleepToastTimer>0) html+='<div class="toast-item t-signal-on">Dopamina ricaricata</div>';
  const depleted=vesCount/MAX_VES<0.05;
  if(caffeineActive&&!depleted) html+='<div class="toast-item t-caff">DAT1 rallentato</div>';
  else if(caffeineActive&&depleted) html+='<div class="toast-item t-caff" style="opacity:.4">Caffeina inutile</div>';
  if(exerciseActive) html+='<div class="toast-item t-exer">'+(depleted?'Ricarica lenta':'Boost dopamina')+'</div>';
  if(sleepDebt>0.3) html+='<div class="toast-item t-sleep">Debito sonno</div>';
  if(vesCount/MAX_VES<0.15) html+='<div class="toast-item t-depl">Esaurimento</div>';
  container.innerHTML=html;
}

function render(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W*.3,H*.5,0,W*.3,H*.5,W*.7);
  bg.addColorStop(0,'#0d1218');bg.addColorStop(1,'#060610');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  drawPreNeuron();drawCleft();drawPostNeurons();drawParticles();drawDAT1();drawCOMT();drawLabels();updateHUD();
}

function drawPreNeuron(){
  const cx=PRE.w*.48,cy=H*.5,t=performance.now()/1000;
  ctx.save();
  const rBase=Math.min(PRE.w*.40,H*.42);
  // Organic cell body
  ctx.beginPath();
  for(let i=0;i<=14;i++){const a=(i/14)*Math.PI*2,w=Math.sin(a*3+t*.5)*rBase*.05+Math.sin(a*5+t*.3)*rBase*.03;
    const px=cx+Math.cos(a)*(rBase*1.05+w),py=cy+Math.sin(a)*(rBase*.95+w);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
  ctx.closePath();
  const cg=ctx.createRadialGradient(cx-10,cy-10,rBase*.1,cx,cy,rBase*1.1);
  cg.addColorStop(0,'#101e2e');cg.addColorStop(.7,'#0b1520');cg.addColorStop(1,'#08101a');
  ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle='#1e3858';ctx.lineWidth=2.5;ctx.stroke();
  // Nucleus
  ctx.beginPath();ctx.ellipse(cx-8,cy-5,rBase*.22,rBase*.18,.2,0,Math.PI*2);ctx.fillStyle='#0e1a28';ctx.fill();ctx.strokeStyle='#1a3050';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx-10,cy-6,rBase*.06,0,Math.PI*2);ctx.fillStyle='#162640';ctx.fill();
  // Precomputed dendrites (stable, no flicker)
  ctx.strokeStyle='#1a3555';ctx.lineCap='round';
  for(const dendGroup of preDendrites){
    for(const s of dendGroup){
      ctx.beginPath();ctx.moveTo(s.sx,s.sy);ctx.quadraticCurveTo(s.cpx,s.cpy,s.ex,s.ey);
      ctx.lineWidth=s.w;ctx.stroke();
      if(s.spine){ctx.beginPath();ctx.arc(s.ex,s.ey,1.5,0,Math.PI*2);ctx.fillStyle='#1a355544';ctx.fill();}
    }
  }
  // Axon toward SNAP25
  ctx.strokeStyle='#1e3858';ctx.lineWidth=4;ctx.beginPath();
  ctx.moveTo(cx+rBase*.85,cy);ctx.quadraticCurveTo(PRE.w-10,cy,SNAP.x,SNAP.y+SNAP.h*.5);ctx.stroke();
  // VMAT2 zone
  const vr=Math.min(VMAT_Z.w,VMAT_Z.h)*.35;
  ctx.globalAlpha=.18;ctx.fillStyle='#3388dd';roundRect(VMAT_Z.x,VMAT_Z.y,VMAT_Z.w,VMAT_Z.h,vr);ctx.fill();
  ctx.globalAlpha=1;ctx.strokeStyle='#3388dd55';ctx.lineWidth=1.5;roundRect(VMAT_Z.x,VMAT_Z.y,VMAT_Z.w,VMAT_Z.h,vr);ctx.stroke();
  ctx.shadowColor='#3388dd';ctx.shadowBlur=8;
  ctx.font='800 .8rem "Segoe UI",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#3388ddaa';ctx.fillText('\u267B VMAT2',VMAT_Z.x+VMAT_Z.w/2,VMAT_Z.y+VMAT_Z.h/2);
  ctx.shadowBlur=0;ctx.font='500 .5rem "Segoe UI",system-ui,sans-serif';ctx.fillStyle='#3388dd66';
  ctx.fillText('ricicla',VMAT_Z.x+VMAT_Z.w/2,VMAT_Z.y+VMAT_Z.h/2+14);
  // MAO-B zone
  const mr=Math.min(MAO_Z.w,MAO_Z.h)*.35;
  ctx.globalAlpha=.18;ctx.fillStyle='#ff3355';roundRect(MAO_Z.x,MAO_Z.y,MAO_Z.w,MAO_Z.h,mr);ctx.fill();
  ctx.globalAlpha=1;ctx.strokeStyle='#ff335555';ctx.lineWidth=1.5;roundRect(MAO_Z.x,MAO_Z.y,MAO_Z.w,MAO_Z.h,mr);ctx.stroke();
  ctx.shadowColor='#ff3355';ctx.shadowBlur=8;
  ctx.font='800 .8rem "Segoe UI",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ff3355aa';ctx.fillText('\u2715 MAO-B',MAO_Z.x+MAO_Z.w/2,MAO_Z.y+MAO_Z.h/2);
  ctx.shadowBlur=0;ctx.font='500 .5rem "Segoe UI",system-ui,sans-serif';ctx.fillStyle='#ff335566';
  ctx.fillText('distrugge',MAO_Z.x+MAO_Z.w/2,MAO_Z.y+MAO_Z.h/2+14);
  // Vesicles
  const filled=Math.floor(vesCount/MAX_VES*50);
  for(let i=0;i<50;i++){const v=vesicles[i],f=i<filled,pulse=Math.sin(t*2+v.ph)*.5+.5,r=f?3.2+pulse*.8:2;
    ctx.beginPath();ctx.arc(v.x,v.y,r,0,Math.PI*2);
    if(f){ctx.fillStyle=`rgba(0,255,136,${.45+pulse*.35})`;ctx.shadowColor='#00ff88';ctx.shadowBlur=5;}
    else{ctx.fillStyle='rgba(30,50,70,0.3)';ctx.shadowBlur=0;}
    ctx.fill();ctx.shadowBlur=0;}
  // SNAP25
  ctx.fillStyle='#1a2a5533';roundRect(SNAP.x-1,SNAP.y,SNAP.w+2,SNAP.h,4);ctx.fill();
  ctx.strokeStyle='#3355aa44';ctx.lineWidth=1.5;roundRect(SNAP.x-1,SNAP.y,SNAP.w+2,SNAP.h,4);ctx.stroke();
  if(stimulus>.15){ctx.shadowColor='#00ff88';ctx.shadowBlur=8+stimulus*10;ctx.beginPath();ctx.arc(SNAP.x+SNAP.w,SNAP.y+SNAP.h/2,3,0,Math.PI*2);ctx.fillStyle=`rgba(0,255,136,${stimulus*.6})`;ctx.fill();ctx.shadowBlur=0;}
  ctx.font='600 .5rem "Segoe UI",system-ui,sans-serif';ctx.fillStyle='#3355aa77';
  ctx.save();ctx.translate(SNAP.x+SNAP.w/2,SNAP.y+SNAP.h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SNAP25',0,0);ctx.restore();
  ctx.restore();
}

function drawCleft(){
  ctx.fillStyle='#070b12';ctx.fillRect(CLEFT.x,0,CLEFT.w,H);
  const dat1Grad=ctx.createLinearGradient(CLEFT.x,0,CLEFT.x+12,0);
  dat1Grad.addColorStop(0,'rgba(170,85,255,0.15)');dat1Grad.addColorStop(1,'rgba(170,85,255,0)');
  ctx.fillStyle=dat1Grad;ctx.fillRect(CLEFT.x,0,12,H);
  ctx.strokeStyle='#aa55ff44';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(CLEFT.x,0);ctx.lineTo(CLEFT.x,H);ctx.stroke();
  ctx.strokeStyle='#ffcc0022';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(CLEFT.x+CLEFT.w,0);ctx.lineTo(CLEFT.x+CLEFT.w,H);ctx.stroke();
}

function drawPostNeurons(){
  for(let i=0;i<postNeurons.length;i++){
    const n=postNeurons[i],t=performance.now()/1000;
    const ncx=n.x+n.w*.5,ncy=n.y+n.h*.5,nRadius=Math.min(n.w*.44,n.h*.40),nrx=nRadius,nry=nRadius;

    // Dendrites from neuron body to receptor line (precomputed bezier)
    ctx.strokeStyle=n.active?'#1e4565':'#152535';ctx.lineWidth=2.5;ctx.lineCap='round';
    if(postDendrites[i]){
      for(const d of postDendrites[i]){
        ctx.beginPath();
        ctx.moveTo(d.sx,d.sy);
        ctx.quadraticCurveTo(d.cpx,d.cpy,d.ex,d.ey);
        ctx.stroke();
        // Small spine bump at receptor end
        ctx.beginPath();ctx.arc(d.ex,d.ey,2,0,Math.PI*2);
        ctx.fillStyle=n.active?'#1e405544':'#15253544';ctx.fill();
      }
    }

    // Cell body
    ctx.save();ctx.beginPath();
    for(let j=0;j<=12;j++){const a=(j/12)*Math.PI*2,w=Math.sin(a*3+t*.6+i)*nry*.08+Math.sin(a*5+t*.35+i*2)*nry*.04;
      const px=ncx+Math.cos(a)*(nrx+w),py=ncy+Math.sin(a)*(nry+w);j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
    ctx.closePath();
    if(n.glow>.01){ctx.shadowColor='#00e5ff';ctx.shadowBlur=30*n.glow;ctx.fillStyle=`rgba(0,229,255,${.05*n.glow})`;ctx.fill();ctx.shadowBlur=0;}
    const cg2=ctx.createRadialGradient(ncx-5,ncy-5,nry*.1,ncx,ncy,Math.max(nrx,nry)*1.1);
    cg2.addColorStop(0,n.active?'#0c2030':'#0a1018');cg2.addColorStop(1,n.active?'#081820':'#070c14');
    ctx.fillStyle=cg2;ctx.fill();ctx.strokeStyle=n.active?`rgba(0,229,255,${.3+n.glow*.6})`:'#152030';ctx.lineWidth=n.active?2.5:1.5;ctx.stroke();
    // Nucleus
    ctx.beginPath();ctx.ellipse(ncx,ncy,nry*.18,nry*.14,0,0,Math.PI*2);ctx.fillStyle='#0c1620';ctx.fill();ctx.strokeStyle='#152535';ctx.lineWidth=1;ctx.stroke();

    // Signal bar (thick)
    const maxDisp=ACT_THRESHOLD*2,signalPct=Math.min(1,n.signal/maxDisp),threshPct=ACT_THRESHOLD/maxDisp;
    const bW=12,bX=n.x+n.w-bW-6,bH=n.h-16,bY=n.y+8;
    ctx.fillStyle='#0c1620';roundRect(bX,bY,bW,bH,3);ctx.fill();
    const threshBarY=bY+bH*(1-threshPct);ctx.fillStyle='#ffffff18';ctx.fillRect(bX-3,threshBarY,bW+6,1);
    const fH=bH*signalPct;if(fH>1){ctx.fillStyle=n.active?'#00e5ff':'#334455';roundRect(bX,bY+bH-fH,bW,fH,3);ctx.fill();}

    ctx.font='800 .8rem "Segoe UI",system-ui,sans-serif';ctx.textAlign='center';
    if(n.active){ctx.fillStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;ctx.fillText('RECETTIVO',ncx,ncy+5);ctx.shadowBlur=0;}
    else{ctx.fillStyle='#1e2e3e';ctx.fillText('silente',ncx,ncy+5);}
    ctx.restore();
  }

  // D2 Receptors
  for(const r of receptors){
    ctx.save();ctx.translate(r.x,r.y);
    const flash=r.occupied?1:(r.cooldown>0?r.cooldown*8:0);
    ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-3,0);ctx.moveTo(-8,-4);ctx.lineTo(-3,0);ctx.moveTo(-8,4);ctx.lineTo(-3,0);
    ctx.strokeStyle=r.occupied?'#00ff88':flash>.1?`rgba(0,255,136,${flash})`:'#ffcc00';
    ctx.lineWidth=r.occupied?2.5:1.5;
    if(r.occupied||flash>.3){ctx.shadowColor='#00ff88';ctx.shadowBlur=8*Math.max(flash,r.occupied?1:0);}
    ctx.stroke();ctx.shadowBlur=0;
    if(r.occupied){ctx.beginPath();ctx.arc(-5,0,2.5,0,Math.PI*2);ctx.fillStyle='#00ff88';ctx.fill();}
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){if(p.state==='dead')continue;ctx.save();ctx.globalAlpha=p.alpha;
    let color='#00ff88',glow=7;
    if(p.state==='reuptake'){color='#00ff88';glow=7;}  // still dopamine, just being transported
    if(p.state==='recycle'){color='#00ff88';glow=7;}  // still dopamine, being stored
    if(p.state==='degrade'||p.state==='comt_destroy'){color='#ff3355';glow=7;}
    if(p.state==='bound'){color='#00ff88';glow=14;}  // still dopamine, just bound — brighter glow
    ctx.beginPath();ctx.arc(p.x,p.y,p.state==='bound'?5:3.5,0,Math.PI*2);
    ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=glow;ctx.fill();ctx.shadowBlur=0;ctx.restore();}
}

function drawDAT1(){
  for(const d of dat1s){ctx.save();
    ctx.beginPath();ctx.arc(d.x,d.y,5,0,Math.PI*2);ctx.fillStyle='#aa55ff';ctx.shadowColor='#aa55ff';ctx.shadowBlur=d.state!=='idle'?12:4;ctx.fill();ctx.shadowBlur=0;
    if(d.arm>0&&d.target){const dx=d.target.x-d.x,dy=d.target.y-d.y,dist=Math.max(1,Math.hypot(dx,dy));
      const armLen=d.arm*Math.min(CLEFT.w+40,dist),tipX=d.x+dx/dist*armLen,tipY=d.y+dy/dist*armLen;
      ctx.beginPath();ctx.moveTo(d.x+5,d.y);ctx.lineTo(tipX,tipY);ctx.strokeStyle=`rgba(170,85,255,${.3+d.arm*.6})`;ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(tipX,tipY,3,0,Math.PI*2);ctx.fillStyle='#aa55ff88';ctx.fill();}
    ctx.restore();}
}

function drawCOMT(){
  for(const c of comts){ctx.save();ctx.translate(c.x,c.y);
    const angle=Math.atan2(c.vy,c.vx);ctx.rotate(angle);
    // Pac-man with wide mouth
    ctx.beginPath();ctx.arc(0,0,7,0.6,Math.PI*2-0.6);ctx.lineTo(0,0);ctx.closePath();
    ctx.fillStyle='#ff8833';ctx.shadowColor='#ff8833';ctx.shadowBlur=6;ctx.fill();
    // Eye
    ctx.shadowBlur=0;ctx.beginPath();ctx.arc(1,-3,1.5,0,Math.PI*2);
    ctx.fillStyle='#0a0a1a';ctx.fill();
    ctx.restore();}
}

function drawLabels(){
  ctx.font='700 .85rem "Segoe UI",system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillStyle='#3a5070';ctx.fillText('Neurone Dopaminergico',PRE.w*.48,H-10);
  ctx.fillStyle='#2a3a50';ctx.fillText('Fessura Sinaptica',CLEFT.x+CLEFT.w/2,H-10);

  ctx.fillText('◂'+displayReabRate+'/s',rateCx+4,rateY);
  ctx.fillStyle='#3a5070';
  const postCenter=POST.x+POST.w*.5;
  const recX=CLEFT.x+CLEFT.w;
  ctx.fillText('Neuroni Riceventi',recX+(W-recX)/2-55,H-10);
  ctx.font='700 .7rem "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle='#aa55ff77';ctx.textAlign='left';ctx.fillText('DAT1',PRE.w+10,18);
  ctx.fillStyle='#ff883377';ctx.textAlign='center';ctx.fillText('COMT',CLEFT.x+CLEFT.w/2,18);
  ctx.fillStyle='#ffcc0077';ctx.font='700 .7rem "Segoe UI",system-ui,sans-serif';ctx.textAlign='right';
  ctx.fillText('D2',CLEFT.x+CLEFT.w-6,18);
}

function updateHUD(){
  const pct=Math.round(vesCount/MAX_VES*100);
  document.getElementById('serbatoio-fill').style.width=pct+'%';
  document.getElementById('serbatoio-pct').textContent=pct+'%';
}

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function loop(ts){const dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;if(!paused)update(dt);render();requestAnimationFrame(loop);}

document.getElementById('stimulus').addEventListener('input',e=>{stimulus=e.target.value/100;document.getElementById('stim-val').textContent=e.target.value+'%';});
document.getElementById('speed').addEventListener('input',e=>{speedMul=parseFloat(e.target.value);document.getElementById('speed-val').textContent=e.target.value+'\u00d7';});
document.getElementById('mode-tog').addEventListener('change',e=>{
  mode=e.target.checked?'normal':'adhd';
  document.querySelector('.t-adhd').style.color=mode==='adhd'?'#ff8833':'#556';
  document.querySelector('.t-norm').style.color=mode==='normal'?'#00e5ff':'#556';
  rebuildReceptors();rebuildDat1();
});
let sleepToastTimer=0;
document.getElementById('btn-reset').addEventListener('click',()=>{
  sleepDebt=0;vesCount=MAX_VES;particles=[];stats={recycled:0,maob:0,comt:0,total:0,binds:0};relAccum=0;
  document.getElementById('sleep-fill').style.width='0';
  sleepToastTimer=3;
  rebuildAll();buildDendrites();
});
document.getElementById('btn-pause').addEventListener('click',()=>{paused=!paused;document.getElementById('btn-pause').textContent=paused?'▶️':'⏸';});

const CAFF_DUR=25, EXER_DUR=12;
let caffeineTimer=0, caffeineActive=false;
let exerciseTimer=0, exerciseActive=false;
// Sleep debt: 0 = fully rested, 1 = total exhaustion. Grows with high stimulus over time.
let sleepDebt=0;
// Per-second rate tracking
let rateReleased=0,rateReabsorbed=0,rateWindow=0,rateRelCount=0,rateReabCount=0;
let displayRelRate=0,displayReabRate=0;

document.getElementById('btn-caffeine').addEventListener('click',()=>{
  if(caffeineActive)return;
  caffeineTimer=CAFF_DUR;caffeineActive=true;
  document.getElementById('caff-fill').style.width='100%';
});

document.getElementById('btn-exercise').addEventListener('click',()=>{
  if(exerciseActive)return;
  exerciseTimer=EXER_DUR;exerciseActive=true;
  document.getElementById('exer-fill').style.width='100%';
});

window.addEventListener('resize',resize);resize();lastT=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
