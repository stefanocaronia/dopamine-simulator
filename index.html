  <header class="top">
    <a class="brand" href="./" aria-label="Dopamine Simulator">
      <span class="logo"><svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="lg-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00ff88" stop-opacity=".38"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>

        </defs>

      <button class="kid-btn" id="kid-btn" type="button" aria-pressed="false" data-tip="kid"><span class="ki" aria-hidden="true">🧒</span><span data-i18n="kid.btn"></span></button>
      <div class="lang" id="lang">
        <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false"><svg class="flag" aria-hidden="true"><use href="#flag-it"/></svg><span class="lang-code">IT</span><span class="chev" aria-hidden="true">⌄</span></button>
        <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>

  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-page="sim" aria-selected="true"><span class="ti">🧪</span><span data-i18n="pg.sim"></span></button>

  </nav>
  <section class="pg" id="page-sim">
    <div class="notice"><span class="ni" aria-hidden="true">ℹ️</span><span data-i18n="notice"></span></div>
    <main id="app">
      <div id="stage">
        <div id="canvas-wrap">
          <canvas id="c"></canvas>
          <button id="btn-pause" data-tip="pause"><svg class="ic-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2.5" width="3.6" height="11" rx="1"/><rect x="9.4" y="2.5" width="3.6" height="11" rx="1"/></svg><svg class="ic-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 2.6v10.8L13.4 8z"/></svg></button>
        </div>
        <div id="toasts"></div>
      </div>
      <aside id="sidebar">
        <div class="card">
          <h2 data-i18n="card.brain"></h2>
          <div class="seg" id="mode-seg"><button class="norm is-on" data-mode="normal" data-tip="mode-normal" data-i18n="mode.normal"></button><button class="adhd" data-mode="adhd" data-tip="mode-adhd" data-i18n="mode.adhd"></button></div>
          <div class="meter d2" data-tip="d2bar"><span class="fill" id="d2-fill"></span><span class="mark" id="d2-mark"></span><span class="in"><span data-i18n="meter.d2"></span><b id="d2-count">12</b></span></div>
          <div class="meter" data-tip="serbatoio"><span class="fill" id="serbatoio-fill"></span><span class="in"><span data-i18n="meter.reservoir"></span><b id="serbatoio-pct">100%</b></span></div>
          <div class="ctrl"><div class="lbl" data-tip="age"><span data-i18n="ctl.age"></span><span class="val" id="age-val">30</span></div><input type="range" id="age" min="5" max="100" value="30" step="1"></div>
          <div class="ctrl"><div class="lbl" data-tip="stimulus"><span data-i18n="ctl.stimulus"></span><span class="val" id="stim-val">10%</span></div><input type="range" id="stimulus" min="0" max="100" value="10"></div>
          <div class="ctrl"><div class="lbl" data-tip="speed"><span data-i18n="ctl.speed"></span><span class="val" id="speed-val">2×</span></div><input type="range" id="speed" min="1" max="8" value="2" step="0.5"></div>
        </div>
        <div class="card">
          <h2 data-i18n="card.actions"></h2>
          <button class="pu" id="btn-caffeine" data-tip="caffeine"><span class="fill caff" id="caff-fill"></span><span class="in" data-i18n="btn.caffeine"></span></button>
          <button class="pu" id="btn-mph" data-tip="mph"><span class="fill mph" id="mph-fill"></span><span class="in" data-i18n="btn.mph"></span></button>
          <button class="pu" id="btn-exercise" data-tip="exercise"><span class="fill exer" id="exer-fill"></span><span class="in" data-i18n="btn.exercise"></span></button>
          <button class="pu" id="btn-reset" data-tip="sleep"><span class="fill sleep" id="sleep-fill"></span><span class="fill sleep-mask" id="sleep-mask"></span><span class="in" data-i18n="btn.sleep"></span></button>
        </div>
        <div class="card">
          <h2 data-i18n="card.subst"></h2>
          <button class="pu" id="btn-scroll" data-tip="scroll"><span class="fill scroll" id="scroll-fill"></span><span class="in" data-i18n="btn.scroll"></span></button>
          <button class="pu" id="btn-nic" data-tip="nic"><span class="fill nic" id="nic-fill"></span><span class="in" data-i18n="btn.nic"></span></button>
          <button class="pu" id="btn-can" data-tip="can"><span class="fill can" id="can-fill"></span><span class="in" data-i18n="btn.can"></span></button>
          <button class="pu" id="btn-alc" data-tip="alc"><span class="fill alc" id="alc-fill"></span><span class="in" data-i18n="btn.alc"></span></button>
          <button class="pu" id="btn-coc" data-tip="coc"><span class="fill coc" id="coc-fill"></span><span class="in" data-i18n="btn.coc"></span></button>
        </div>
        <div class="card">
          <h2 data-i18n="card.legend"></h2>
          <div class="legend">
            <div class="leg" data-tip="particle"><span class="dot" style="background:#00ff88;color:#00ff88"></span><span data-i18n="leg.dopa"></span></div>
            <div class="leg" data-tip="dead"><span class="dot" style="background:#ff3355;color:#ff3355"></span><span data-i18n="leg.dead"></span></div>
            <div class="leg" data-tip="dat1"><span class="gl-dat"></span><span data-i18n="leg.dat1"></span></div>
            <div class="leg" data-tip="comt"><span class="gl-comt"></span><span data-i18n="leg.comt"></span></div>
            <div class="leg" data-tip="vmat2"><span class="gl-vmat"></span><span data-i18n="leg.vmat2"></span></div>
            <div class="leg" data-tip="maob"><span class="gl-mao"></span><span data-i18n="leg.maob"></span></div>
            <div class="leg" data-tip="d2"><span class="gl-d2"></span><span data-i18n="leg.d2"></span></div>
            <div class="leg" data-tip="post"><span class="dot" style="background:#00e5ff;color:#00e5ff"></span><span data-i18n="leg.active"></span></div>
          </div>
        </div>
      </aside>
    </main>
  </section>
